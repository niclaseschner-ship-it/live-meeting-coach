# Reproduzierbares Lockfile fürs Docker-Image (Ticket #65). Löst requirements.txt vollständig auf (inkl.
# Transitiv-Abhängigkeiten, uvicorn[standard]) und pinnt exakte Versionen statt `>=` – ein Bau zieht immer
# dieselben Pakete. uvloop/httptools/watchfiles kommen aus dem `standard`-Extra von uvicorn.
#
# Neu erzeugen (auf dem Pi zieht /etc/pip.conf sonst piwheels/ARM-Wheels):
#   pip install pip-tools
#   python -m piptools compile requirements.txt --output-file=requirements.lock \
#     --no-annotate --strip-extras --no-emit-index-url --no-header \
#     --pip-args "--index-url https://pypi.org/simple"
# Das Dockerfile baut mit --platform linux/amd64 (Cloudflare Containers) – pip löst die Pins dort gegen die
# amd64-Wheels von PyPI auf; geprüft mit `docker buildx build --platform linux/amd64` (README „Bauen: Pi oder
# Windows-Laptop?“).
